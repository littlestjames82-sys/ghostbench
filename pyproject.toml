[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostbench"
version = "0.1.0"
description = "Proof harness for GhostSlice: full vs sliced context, scored the same way every time (Tier A static, Tier B live opt-in)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["llm", "benchmark", "context", "ghostslice", "agents"]
dependencies = []

[project.scripts]
ghostbench = "ghostbench.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
